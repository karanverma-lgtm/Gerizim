<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Green Outer Triangle -->
  <polygon points="200,20 380,350 20,350" fill="#00A859" filter="url(#logoGlow)"/>

  <!-- Inner White Mask Circle -->
  <circle cx="200" cy="235" r="95" fill="#FFFFFF"/>

  <!-- Green Ring Frame -->
  <circle cx="200" cy="235" r="95" fill="none" stroke="#00A859" stroke-width="14"/>

  <!-- 4-Petal Yellow Clover Motif inside Green Ring -->
  <g transform="translate(200, 235)">
    <!-- Petal 1 (Top Left) -->
    <path d="M-5 -5 C-45 -5 -45 -45 -5 -45 C-5 -25 -5 -5 -5 -5 Z" fill="#FFC72C" stroke="#00A859" stroke-width="4"/>
    <!-- Petal 2 (Top Right) -->
    <path d="M5 -5 C5 -45 45 -45 45 -5 C25 -5 5 -5 5 -5 Z" fill="#FFC72C" stroke="#00A859" stroke-width="4"/>
    <!-- Petal 3 (Bottom Right) -->
    <path d="M5 5 C45 5 45 45 5 45 C5 25 5 5 5 5 Z" fill="#FFC72C" stroke="#00A859" stroke-width="4"/>
    <!-- Petal 4 (Bottom Left) -->
    <path d="M-5 5 C-5 45 -45 45 -45 5 C-25 5 -5 5 -5 5 Z" fill="#FFC72C" stroke="#00A859" stroke-width="4"/>

    <!-- Central Interlocking G Curves -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#00A859" stroke-width="5"/>
    <path d="M-16 0A16 16 0 0 1 16 0" fill="none" stroke="#FFC72C" stroke-width="6"/>
  </g>
</svg>